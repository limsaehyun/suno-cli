[advisories]
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { allow = ["LGPL-3.0-or-later"], crate = "libesedb" },
  { allow = ["LGPL-3.0-or-later"], crate = "libesedb-sys" },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
