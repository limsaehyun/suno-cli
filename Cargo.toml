[package]
name = "suno"
version = "0.10.0"
edition = "2024"
description = "Generate AI music from your terminal — Suno v6 with tags, exclude, vocal control, duration, variety, and remaster"
license = "MIT"
repository = "https://github.com/StevenBuglione/suno-cli"
homepage = "https://github.com/StevenBuglione/suno-cli"
readme = "README.md"
keywords = ["suno", "music", "ai", "cli", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "suno"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "net", "signal"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
figment = { version = "0.10", features = ["toml", "env"] }
comfy-table = "7"
indicatif = "0.17"
directories = "5"
base64 = "0.22"
futures-util = "0.3"
id3 = "1"
rookie = "0.5"
uuid = { version = "1", features = ["v4"] }
# archive-zip + zip-deflate: release.yml ships a .zip on Windows; self_update
# returns ArchiveNotEnabled("zip") without them.
self_update = { version = "0.44", default-features = false, features = ["reqwest", "rustls", "compression-flate2", "archive-tar", "archive-zip", "compression-zip-deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"

# Process-liveness for the duplicate guard is platform-specific: libc::kill on
# Unix, OpenProcess on Windows. Gated so neither pulls onto the wrong target.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
figment = { version = "0.10", features = ["toml", "env", "test"] }
jsonschema = { version = "0.48.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
